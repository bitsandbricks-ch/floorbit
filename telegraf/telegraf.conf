# Made by Floorbit from Settings > Telemetry (docs/telemetry.md). Changes here are
# overwritten: change the devices there instead.

[agent]
  interval = "30s"
  round_interval = true
  flush_interval = "5s"
  metric_buffer_limit = 100000
  omit_hostname = true

[[outputs.http]]
  url = "http://floorbit:5000/api/telemetry/write"
  method = "POST"
  data_format = "influx"
  content_encoding = "gzip"
  timeout = "10s"
  [outputs.http.headers]
    Authorization = "Token fbt_oIaLZS_Dhp_xsu2UwRDnshNfb1TqZN0a"

[[inputs.internal]]
  collect_memstats = false
  namedrop = ["*"]

