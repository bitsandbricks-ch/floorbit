# Tool settings only: the app is not a package. Dependencies live in requirements*.txt.

[tool.ruff]
target-version = "py311"           # the Dockerfile's Python
line-length = 120
extend-exclude = [".claude", ".planning"]

[tool.ruff.lint]
# Pinned, so a ruff upgrade doesn't change what fails. Widen it in an MR that also fixes the code.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "UP",       # pyupgrade (for target-version)
    "B",        # bugbear
    "BLE",      # no blind `except Exception`
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "C408",     # dict(key=...) reads better than a literal for the settings schema
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
