# Mason (the `mason` command and the web app) reads this file. The defaults say what every
# repo should look like; this file has the last word for this repo. Review changes to it like
# code: it can turn rules off.
#
#   mason bump floorbit minor     PR that sets VERSION and adds the CHANGELOG section
#   mason release tag floorbit    pushes v<version>; the release job in .github/workflows/ci.yml does the rest
#   mason doctor floorbit         settings, protected branches and files against the defaults

owner = "mike"
templates = true                       # an issue template and a pull request template must exist

[release]
version = "VERSION"
changelog = ["CHANGELOG.md"]
tag = "v{version}"

# Branch protection and repo settings come from the org defaults (bitsandbricks-ch/.mason).
