# Mason (the `mason` command and the web app) reads this file. The org's defaults
# (bitsandbricks-ch/.mason) say what every repo should look like; this file has the last
# word for this repo. Review changes to it like code: it can turn org rules off.
#
#   mason bump floorbit minor     PR that sets VERSION and adds the CHANGELOG section
#   mason release tag floorbit    pushes v<version>; .github/workflows/release.yml makes the release
#   mason doctor floorbit         settings, rulesets and files against the defaults
#
# Releases are immutable and made by the workflow, so push only the tag.
# The master ruleset requires this check (.github/rulesets/main.json).
protect = { checks = ["CI passed"] }

[release]
version = "VERSION"
changelog = ["CHANGELOG.md"]
tag = "v{version}"
