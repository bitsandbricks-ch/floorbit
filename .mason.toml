# Mason (the `mason` command and the web app) reads this file. The defaults say what every
# repo should look like; this file has the last word for this repo. Review changes to it like
# code: it can turn rules off.
#
#   mason bump lal-floorplan minor     MR that sets VERSION and adds the CHANGELOG section
#   mason release tag lal-floorplan    pushes v<version>; the release job in .gitlab-ci.yml does the rest
#   mason doctor lal-floorplan         settings, protected branches and files against the defaults

owner = "mike"
templates = true                       # an issue template and a merge request template must exist

[release]
version = "VERSION"
changelog = ["CHANGELOG.md"]
tag = "v{version}"

[gitlab]
# Merge only with a green pipeline; nobody pushes to master directly, developers merge.
settings = { only_allow_merge_if_pipeline_succeeds = true, remove_source_branch_after_merge = true, squash_option = "default_on" }
protected_branches = { master = { push_access_level = 0, merge_access_level = 30 } }
