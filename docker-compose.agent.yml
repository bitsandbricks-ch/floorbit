# The local agent for a hosted Floorbit (docs/agent.md). Run it on the event network, next to
# LibreNMS and NetBox, not on the hosted server:
#
#   cp agent.env.example agent.env      # FLOORBIT_URL and FLOORBIT_AGENT_KEY
#   docker compose -f docker-compose.agent.yml up -d
#
# It connects out over HTTPS. LibreNMS, NetBox and the rest are set up in Floorbit (Settings >
# Plugins). Attendees, phones and the crew's seat walk-through reach it on 443 and 80 (the plugin
# "Front door for attendees", on by default): point the event DNS name of check-in at this machine.
# To take the event's syslog or flows, uncomment those ports below. Telegraf for device telemetry is
# in the image: nothing else to start (docs/agent.md, "Telegraf").

services:
  agent:
    # The agent has its own image and releases: bitsandbricks-ch/floorbit-agent.
    image: ghcr.io/bitsandbricks-ch/floorbit-agent:${FLOORBIT_AGENT_VERSION:-latest}
    env_file:
      - path: agent.env
        required: true
    environment:
      # Its own small settings file; it keeps no floor plan.
      FLOORBIT_DATA_FILE: /app/state/agent-data.json
    volumes:
      - agent_state:/app/state
    ports:
      # /metrics and /healthz, on this machine only.
      - "127.0.0.1:9520:9520"
      # Device telemetry: the agent runs Telegraf itself. SNMP traps and Cisco model-driven
      # telemetry from the devices (another trap receiver on this machine: change the left side).
      - "${TRAP_PUBLISH_PORT:-162}:1162/udp"
      - "${MDT_PUBLISH_PORT:-57000}:57000"
      # Attendees: check-in, the check-in note on phones and the crew's seat walk-through, on one
      # listener. HTTPS once the agent has a certificate; until then 443 speaks plain HTTP too.
      - "${HTTPS_PUBLISH_PORT:-443}:8443"
      - "${HTTP_PUBLISH_PORT:-80}:8080"
      # Uncomment what the plugins listen for: syslog, NetFlow, a firewall's own Telegraf sending
      # to the telemetry listener. Every port: docs/agent.md, "Ports".
      # - "514:5514/udp"
      # - "2055:2055/udp"
      # - "8186:8186"
    # A refused key (revoked or wrong) stops the agent with exit code 1: don't restart it into
    # the same refusal every few seconds. Network trouble doesn't stop it; it retries by itself.
    restart: on-failure:3
    # Whether the hosted Floorbit answered in the last two minutes, so `docker ps` shows a lost
    # uplink. The image has the same check; it's here so it can be tuned.
    healthcheck:
      test: ["CMD", "python", "-m", "floorbit_agent", "health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 2

volumes:
  agent_state:
