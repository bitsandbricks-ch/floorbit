# Syslog from the hall, through the local agent. See docs/syslog.md, "Through the local agent".
id: syslog-relay
name: Syslog from the hall
icon: bell
version: "1.0.0"
floorbit: ">=0.1,<2"
description: "The local agent listens for syslog on the event network and sends the lines on over its HTTPS link, to the Logs page and the alerts. Lines wait on the agent's disk while the hosted Floorbit can't be reached."
author: Floorbit
uses: [agent, settings]
settings:
  # Fixed like the agent's other ports (#1436): the compose file and the pod publish 514/udp to it.
  - {key: port, label: UDP port on the agent, type: int, default: 5514, min: 0, max: 65535, advanced: true,
     help: "Where the agent listens for syslog. The compose file publishes the machine's udp/514 to it. 0: off."}
  - {key: bind, label: Listen address, type: string, placeholder: 0.0.0.0, advanced: true,
     help: "The agent's address to listen on. Empty: all of them."}
agent:
  sends:
    lines: {privacy: device}
