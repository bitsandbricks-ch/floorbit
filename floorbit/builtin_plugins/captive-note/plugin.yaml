# The Captive Portal API (RFC 8908) in the hall, through the local agent. See docs/integrations.md.
id: captive-note
name: Check-in note on phones
icon: phone
version: "1.0.0"
floorbit: ">=0.1,<2"
description: "The local agent answers the Captive Portal API on the event network (DHCP option 114), so phones and laptops show a quiet sign-in note until their seat has checked in. Nothing is ever blocked. It keeps answering from the last word while the hosted Floorbit is away."
author: Floorbit
uses: [agent, settings]
settings:
  - {key: address, label: Address on the agent, type: string, placeholder: "0.0.0.0:8908",
     help: "host:port the agent answers on. Serve it behind the event's reverse proxy with a certificate: RFC 8908 wants HTTPS. Empty: off."}
  - {key: portal_url, label: Sign-in page, type: string, placeholder: "https://checkin.lan.example/",
     help: "Where the note leads. Empty: the check-in page the hosted Floorbit names."}
  - {key: proxies, label: Reverse proxy addresses, type: string, placeholder: "192.0.2.5",
     help: "Comma-separated. From these, the client's address is taken from X-Forwarded-For."}
agent:
  fetches: [state]
