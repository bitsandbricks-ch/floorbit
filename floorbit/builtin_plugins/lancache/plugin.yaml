# The LAN cache (lancache.net) and its DNS (lancache-dns), read in the hall by the local agent.
# See docs/lancache.md.
id: lancache
name: LAN cache
version: "1.0.0"
floorbit: ">=0.1,<2"
description: "What the LAN cache served (per service, from disk or the internet), the downloads enough players fetched, lancache-dns lookups, its disk and whether it answers. Read by the local agent in the hall; hall-wide numbers only."
author: Floorbit
homepage: https://lancache.net
uses: [agent, settings, actions, widgets]
settings:
  - {key: access_log, label: Access log, type: string, placeholder: /lancache/logs/access.log,
     help: "The cache's access.log as the agent sees it (mount the cache's logs folder read-only into the agent)."}
  - {key: dns_log, label: DNS query log, type: string, placeholder: /lancache/dns/query.log,
     help: "lancache-dns's query log (bind with querylog on), as the agent sees it. Empty: no DNS numbers."}
  - {key: cache_dir, label: Cache folder, type: string, placeholder: /lancache/cache/cache,
     help: "The folder with nginx's hash folders (00 to ff), as the agent sees it: for the disk use, and for clearing the cache (then mounted writable)."}
  - {key: cache_host, label: Cache address, type: string, placeholder: cache.lan.example,
     help: "Name or address of the cache on the event network, for the heartbeat check."}
  - {key: dns_server, label: lancache-dns address, type: string, placeholder: 192.0.2.53,
     help: "Checks that it sends the cached services to the cache. Needs the cache address."}
  - {key: min_clients, label: Players before a download or site is named, type: int, default: 5, min: 2, max: 50}
  - {key: interval, label: Seconds between reads, type: int, default: 30, min: 10, max: 600}
actions:
  - {id: clear_cache, label: Clear the cache, role: admin, danger: true,
     help: "Empties the cache folder on the cache machine. Players download everything from the internet again. The agent must allow it (FLOORBIT_AGENT_ALLOW_ACTIONS=lancache.clear_cache)."}
widgets:
  - {id: hit_ratio, label: LAN cache, refresh: 60}
agent:
  sends:
    stats: {privacy: aggregate}
    status: {privacy: device}
  calls: [status]
  actions: [clear_cache]
