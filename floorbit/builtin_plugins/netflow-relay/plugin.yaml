# NetFlow and IPFIX from the hall, through the local agent. See docs/agent.md, "Traffic".
id: netflow-relay
name: Traffic from the hall
icon: network
version: "1.0.0"
floorbit: ">=0.1,<2"
description: "The local agent collects NetFlow and IPFIX on the event network and sends only the summary the Traffic page shows (hall, area and service totals, per seat volume and mix). The flow records, with addresses and ports, stay on the agent."
author: Floorbit
uses: [agent, settings]
settings:
  # Fixed like the agent's other ports (#1436): the compose file and the pod publish 2055/udp to it.
  - {key: port, label: UDP port on the agent, type: int, default: 2055, min: 0, max: 65535, advanced: true,
     help: "Where the agent listens for NetFlow and IPFIX. The compose file publishes the machine's udp/2055 to it. 0: off."}
  - {key: bind, label: Listen address, type: string, placeholder: 0.0.0.0, advanced: true,
     help: "The agent's address to listen on. Empty: all of them."}
agent:
  sends:
    summary: {privacy: device, latest: true}
  fetches: [seats]
  # The flow lookup (floorbit/flows/lookup.py, #1481 C): read-only, asked by someone with
  # traffic.investigate who gave a reason (audit-logged on the hosted side).
  calls: [lookup, seat_summary]
