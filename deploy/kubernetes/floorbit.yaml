# Floorbit on Kubernetes or k3s, one replica. Guide: docs/kubernetes.md.
#
#   kubectl create namespace floorbit
#   kubectl -n floorbit create secret generic floorbit --from-literal=SECRET_KEY="$(openssl rand -hex 32)"
#   kubectl -n floorbit apply -f deploy/kubernetes/floorbit.yaml
#
# The pod runs Floorbit and its local agent side by side: Floorbit reaches the event network
# (switches, LibreNMS, NetBox, game servers, ...) only through the agent, as a hosted one does
# (docs/agent.md). Floorbit writes the agent's key into a volume only the two share and enrols it
# as "Local agent". Run the cluster where the event network is reachable, or use a hosted Floorbit
# with an agent in the hall instead.
#
# Everything Floorbit keeps (data.json, accounts, the audit log, plugin state, check-ins) is in
# /app/state. Without the volume below, every new pod (an update, a restart, a moved node) starts
# empty: that's the claim `floorbit-state`, so keep it.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: floorbit-state
spec:
  accessModes: ["ReadWriteOnce"]
  # k3s: local-path, the default class. Elsewhere, leave it out for the cluster's default.
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floorbit
spec:
  # One replica: the agent link and the live updates are held in the pod's memory (docs/kubernetes.md, "More than one pod").
  replicas: 1
  # The old pod lets go of the volume before the new one starts: a ReadWriteOnce volume can't be shared.
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: floorbit}
  template:
    metadata:
      labels: {app: floorbit}
    spec:
      securityContext:
        # The image runs as this user; the volume is made writable for it.
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: floorbit
          image: ghcr.io/bitsandbricks-ch/floorbit:latest   # pin a version for events: floorbit:1.2.3
          ports:
            - {name: http, containerPort: 5000}
          env:
            - {name: REDIS_HOST, value: floorbit-valkey}
            - {name: PUBLIC_URL, value: "https://floor.example.com"}
            - {name: TZ, value: "UTC"}                      # the event's time zone, e.g. Europe/Zurich
            # Only the Ingress reaches the pod, so its X-Forwarded-For names the real client
            # (the sign-in lockout and check-in count each visitor, not Traefik).
            - {name: CHECKIN_TRUST_PROXY, value: "true"}
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: floorbit, key: SECRET_KEY}}
            - {name: FLOORBIT_LOCAL_AGENT_KEY_FILE, value: /app/agent-key/local-agent.key}
          volumeMounts:
            - {name: state, mountPath: /app/state}
            - {name: agent-key, mountPath: /app/agent-key}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
        - name: agent
          image: ghcr.io/bitsandbricks-ch/floorbit-agent:latest   # pin a version for events too
          env:
            # The same pod: the link never leaves it, so plain HTTP is fine.
            - {name: FLOORBIT_URL, value: "http://localhost:5000"}
            - {name: FLOORBIT_AGENT_INSECURE, value: "1"}
            - {name: FLOORBIT_AGENT_KEY_FILE, value: /run/floorbit-agent/local-agent.key}
            - {name: FLOORBIT_DATA_FILE, value: /agent-state/agent-data.json}
            - {name: FLOORBIT_AGENT_SYSLOG_PORT, value: "5514"}
            - {name: FLOORBIT_AGENT_FLOWS_PORT, value: "2055"}
            # The attendee front door (docs/agent.md): check-in learns each seat PC's address only here.
            - {name: FLOORBIT_AGENT_FRONT_DOOR, value: "0.0.0.0:8443"}
            - {name: TZ, value: "UTC"}
            # LibreNMS, NetBox and the other sources are set in Floorbit (Settings > Plugins); the
            # agent takes them from there. Env-only ones go here, e.g. LIBRENMS_URL.
          ports:
            - {name: syslog, containerPort: 5514, protocol: UDP}
            - {name: flows, containerPort: 2055, protocol: UDP}
            - {name: checkin, containerPort: 8443}
          volumeMounts:
            - {name: agent-key, mountPath: /run/floorbit-agent, readOnly: true}
            - {name: agent-state, mountPath: /agent-state}
          livenessProbe:
            exec: {command: ["python", "-m", "floorbit_agent", "health"]}
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: floorbit-state}
        # Floorbit writes a new key at each start, so neither needs keeping.
        - name: agent-key
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: agent-state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: floorbit
spec:
  selector: {app: floorbit}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Syslog (docs/syslog.md) and NetFlow/IPFIX (docs/flows.md) from the event's devices, to the agent.
# k3s's ServiceLB opens these on the nodes: point the devices at a node's address.
apiVersion: v1
kind: Service
metadata:
  name: floorbit-agent
spec:
  type: LoadBalancer
  selector: {app: floorbit}
  ports:
    - {name: syslog, port: 514, targetPort: syslog, protocol: UDP}
    - {name: flows, port: 2055, targetPort: flows, protocol: UDP}
    # The attendee front door: point CHECKIN_ADDRESS (e.g. checkin.lan) at a node's address.
    - {name: checkin, port: 80, targetPort: checkin}
---
# The cache for LibreNMS answers. Nothing in it needs keeping, so no volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floorbit-valkey
spec:
  replicas: 1
  selector:
    matchLabels: {app: floorbit-valkey}
  template:
    metadata:
      labels: {app: floorbit-valkey}
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.1-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - {name: valkey, containerPort: 6379}
          readinessProbe:
            exec: {command: ["valkey-cli", "ping"]}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: floorbit-valkey
spec:
  selector: {app: floorbit-valkey}
  ports:
    - {name: valkey, port: 6379, targetPort: valkey}
---
# k3s ships Traefik: this routes floor.example.com to Floorbit. It passes WebSockets (the local
# agent's link) and Server-Sent Events (live updates) as they are.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: floorbit
spec:
  rules:
    - host: floor.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: floorbit, port: {name: http}}
  # tls:
  #   - hosts: [floor.example.com]
  #     secretName: floorbit-tls     # cert-manager, or a certificate you add yourself
