# Floorbit and Redis. Setup guide: docs/install.md.
#
#   cp .env.example .env      # optional: NetBox, LibreNMS, first account, ...
#   docker compose up -d
#
# Then open http://localhost:8080 (FLOORBIT_PORT). Settings come from .env; most can also be
# changed later under Settings, and values saved there win over .env.

services:
  floorbit:
    image: ghcr.io/bitsandbricks-ch/floorbit:${FLOORBIT_VERSION:-latest}
    ports:
      - "${FLOORBIT_PORT:-8080}:5000"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_HOST: redis
    volumes:
      # data.json, accounts, the audit log, plugin state and check-ins: back this up.
      - floorbit_state:/app/state
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Optional: the NetFlow/IPFIX collector for the Traffic page (docs/flows.md). Start it with
  #   docker compose --profile flows up -d
  # and point the switches or the router at this host, udp/2055 (FLOWS_PORT).
  flows:
    image: ghcr.io/bitsandbricks-ch/floorbit:${FLOORBIT_VERSION:-latest}
    profiles: ["flows"]
    command: ["python", "-m", "floorbit.flows"]
    ports:
      - "${FLOWS_PORT:-2055}:2055/udp"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_HOST: redis
      FLOWS_PORT: "2055"
    volumes:
      # Reads the seat addresses from the same state; keeps raw flows under /app/state/flows.
      - floorbit_state:/app/state
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The cache for LibreNMS answers, and the hand-over from the flow collector. Only Floorbit talks
  # to it, so no port is published.
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  floorbit_state:
  redis_data:
