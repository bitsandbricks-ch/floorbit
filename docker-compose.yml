# Floorbit, its local agent and Valkey (the Redis-compatible cache). Setup guide: docs/install.md.
#
#   cp .env.example .env      # optional: NetBox, LibreNMS, first account, ...
#   docker compose up -d
#
# Then open http://localhost:8080 (FLOORBIT_PORT). Settings come from .env; most can also be
# changed later under Settings, and values saved there win over .env.
#
# Floorbit reaches the event network (switches, LibreNMS, NetBox, game servers, ...) only through
# the agent, the same way as a hosted Floorbit does (docs/agent.md). Here it runs next to it and
# enrols itself: nothing to copy from Settings.

services:
  floorbit:
    image: ghcr.io/bitsandbricks-ch/floorbit:${FLOORBIT_VERSION:-latest}
    ports:
      - "${FLOORBIT_PORT:-8080}:5000"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_HOST: valkey
      # Floorbit writes the agent's key here and enrols it as "Local agent".
      FLOORBIT_LOCAL_AGENT_KEY_FILE: /app/agent-key/local-agent.key
    volumes:
      # data.json, accounts, the audit log, plugin state and check-ins: back this up.
      - floorbit_state:/app/state
      - agent_key:/app/agent-key
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # The local agent: answers Floorbit's calls on the event network and takes the event's syslog
  # and flows (docs/agent.md). It talks to Floorbit inside this Compose network only.
  agent:
    # The agent has its own image and releases: bitsandbricks-ch/floorbit-agent.
    image: ghcr.io/bitsandbricks-ch/floorbit-agent:${FLOORBIT_AGENT_VERSION:-latest}
    env_file:
      - path: .env
        required: false
    environment:
      FLOORBIT_URL: http://floorbit:5000
      # Plain HTTP is fine here: the link never leaves this host's Compose network.
      FLOORBIT_AGENT_INSECURE: "1"
      FLOORBIT_AGENT_KEY_FILE: /run/floorbit-agent/local-agent.key
      # Its own small settings file; it keeps no floor plan.
      FLOORBIT_DATA_FILE: /app/state/agent-data.json
      FLOORBIT_AGENT_SYSLOG_PORT: "5514"
      FLOORBIT_AGENT_FLOWS_PORT: "2055"
    volumes:
      - agent_state:/app/state
      - agent_key:/run/floorbit-agent:ro
    ports:
      # Syslog from switches, firewalls and DHCP servers (docs/syslog.md), and NetFlow/IPFIX for the
      # Traffic page (docs/flows.md). Point the devices at this host.
      - "${SYSLOG_PUBLISH_PORT:-514}:5514/udp"
      - "${FLOWS_PORT:-2055}:2055/udp"
      # The attendee front door (FLOORBIT_AGENT_FRONT_DOOR=0.0.0.0:8443 in .env), docs/agent.md:
      # - "443:8443"
    depends_on:
      floorbit:
        condition: service_healthy
    restart: unless-stopped

  # Optional: Telegraf collects device telemetry (SNMP, traps, gNMI, Cisco MDT) for Floorbit
  # (docs/telemetry.md). The agent writes its config from Settings > Telemetry and takes what it
  # collects; Telegraf reloads the config when it changes.
  #   docker compose --profile telemetry up -d
  telegraf:
    image: telegraf:1.40.3
    profiles: ["telemetry"]
    # The agent's user, so it can read the config the agent wrote (mode 600, secrets in it).
    user: "10001"
    entrypoint: ["sh", "-c", "until [ -f /app/state/plugins/telemetry/telegraf.conf ]; do sleep 5; done; exec telegraf --config /app/state/plugins/telemetry/telegraf.conf --watch-config notify"]
    ports:
      - "${TRAP_PUBLISH_PORT:-162}:1162/udp"   # SNMP traps
      - "${MDT_PUBLISH_PORT:-57000}:57000"     # Cisco model-driven telemetry, dial-out
    volumes:
      - agent_state:/app/state:ro
    depends_on:
      - agent
    restart: unless-stopped

  # Optional: keep telemetry history in VictoriaMetrics instead of Floorbit's own database
  # (docs/telemetry.md, "Storage"). Set FLOORBIT_VICTORIAMETRICS_URL=http://victoriametrics:8428.
  #   docker compose --profile metrics up -d
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.156.0
    profiles: ["metrics"]
    # dedup: a batch sent twice (two agents, a replay after a failover) is kept once.
    command: ["-storageDataPath=/storage", "-retentionPeriod=${TELEMETRY_RETENTION:-30d}", "-dedup.minScrapeInterval=30s"]
    volumes:
      - victoriametrics_data:/storage
    restart: unless-stopped

  # Optional: log events in VictoriaLogs. Set FLOORBIT_VICTORIALOGS_URL=http://victorialogs:9428.
  #   docker compose --profile logs up -d
  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0
    profiles: ["logs"]
    command: ["-storageDataPath=/storage", "-retentionPeriod=${LOG_RETENTION:-7d}"]
    volumes:
      - victorialogs_data:/storage
    restart: unless-stopped

  # Optional: Grafana to dig into the history (VictoriaMetrics speaks the Prometheus API).
  #   docker compose --profile grafana up -d     (http://localhost:3000)
  grafana:
    image: grafana/grafana:13.1.0
    profiles: ["grafana"]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  # The cache for LibreNMS answers and live updates. Only Floorbit talks to it, so no port is
  # published.
  # Valkey is the open-source fork of Redis and speaks the same protocol, so the REDIS_* settings
  # and the client stay as they are.
  valkey:
    image: valkey/valkey:8.1-alpine
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  floorbit_state:
  agent_state:
  agent_key:
  valkey_data:
  victoriametrics_data:
  victorialogs_data:
  grafana_data:
