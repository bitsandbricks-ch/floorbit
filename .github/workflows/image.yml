# Builds the Dockerfile on every pull request; on master and on v* tags it also pushes
# ghcr.io/<owner>/<repo> (tags: latest on master, the version on a tag, and the short sha).
# master builds also get master-<YYYYMMDDHHMMSS>-<short sha> (commit time, UTC): a tag that
# sorts by time, so a deployment (Flux image automation on Oak) can follow the newest one.
name: Image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A release image carries its signed agent plugins (release.yml signs them), so the hosted
      # Floorbit can hand them to the agents. Waits for the release, which this tag starts too.
      - name: Signed agent plugins
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 40); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release download "$TAG" --pattern 'agent-plugins-*.tar.gz' --dir "$RUNNER_TEMP/ap" 2>/dev/null; then
                tar -xzf "$RUNNER_TEMP"/ap/agent-plugins-*.tar.gz -C agent-bundles
                ls agent-bundles
              else
                echo "::warning::$TAG has no signed agent plugins"
              fi
              exit 0
            fi
            sleep 15
          done
          echo "::error::the release $TAG did not appear within 10 minutes" && exit 1
      - name: Build
        env:
          REPO: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPO,,}"
          tags=(-t "$image:${GITHUB_SHA::12}")
          if [ "$GITHUB_REF" = refs/heads/master ]; then
            ts=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)
            tags+=(-t "$image:latest" -t "$image:master-$ts-${GITHUB_SHA::7}")
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then tags+=(-t "$image:${GITHUB_REF_NAME#v}"); fi
          docker build --label "org.opencontainers.image.source=https://github.com/$REPO" "${tags[@]}" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"
