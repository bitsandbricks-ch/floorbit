<!DOCTYPE html>
<html lang="en" {{ theme.html_attrs if theme is defined }}>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users · Floorbit</title>
  {% include "_theme_head.html" %}
  <link rel="stylesheet" href="/static/css/attribution.css" />
  <link rel="stylesheet" href="/static/css/settings.css" />
  <link rel="stylesheet" href="/static/css/user-menu.css" />
  <link rel="stylesheet" href="/static/css/users.css" />
</head>
<body>
  <header class="st-header">
    <a class="st-back" href="/settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Settings
    </a>
    <h1>Users</h1>
    <span class="st-header-spacer"></span>
    {% if current_user %}
    <form class="user-menu" method="post" action="/logout">
      <span class="user-menu-name" title="Signed in as {{ current_user.username }}">{{ current_user.display_name }}</span>
      <button type="submit" class="st-btn">Sign out</button>
    </form>
    {% endif %}
  </header>

  <main class="st-main">
    <p class="st-intro" id="us-roles"></p>

    <section class="st-card">
      <h2>Accounts</h2>
      <p class="st-card-desc">Role changes apply at once. A password reset signs that person out everywhere.</p>
      <div class="us-list" id="us-list" aria-live="polite"></div>
    </section>

    <section class="st-card">
      <h2>Add an account</h2>
      <form class="us-add" id="us-add" autocomplete="off">
        <label><span>Username</span>
          <input type="text" name="username" required maxlength="32" autocapitalize="none" spellcheck="false" placeholder="e.g. helper1" /></label>
        <label><span>Display name</span>
          <input type="text" name="display_name" maxlength="64" placeholder="Optional" /></label>
        <label><span>Password</span>
          <input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters" /></label>
        <label><span>Role</span>
          <select name="role" id="us-add-role"></select></label>
        <div class="us-add-actions">
          <span class="us-msg" id="us-add-msg" role="status"></span>
          <button type="submit" class="st-btn st-btn-primary">Add account</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/users.js"></script>
  {% include "_attribution.html" %}
</body>
</html>
