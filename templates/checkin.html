<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat check-in · Floorbit</title>
  <link rel="stylesheet" href="/static/css/attribution.css" />
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
      --muted: #8b949e; --accent: #f0883e; --ok: #3fb950; --err: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 380px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 10px; padding: 24px;
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
    input {
      width: 100%; padding: 10px 12px; font-size: 16px; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    button {
      width: 100%; margin-top: 20px; padding: 11px; font-size: 15px; font-weight: 600;
      color: #0d1117; background: var(--accent); border: 0; border-radius: 6px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .msg { margin-top: 16px; font-size: 14px; min-height: 1.5em; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--err); }
    .meta { margin-top: 12px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <h1>Seat check-in</h1>
    <p class="sub">Tell us where you sit so the network team can find you fast if something breaks. Check in from the PC at your seat.</p>

    <label for="seat">Seat number</label>
    <input id="seat" name="seat" placeholder="e.g. D-22" maxlength="16" required autocapitalize="characters" />

    <label for="username">Username / nickname</label>
    <input id="username" name="username" placeholder="Your name at the event" maxlength="48" required />

    <button type="submit" id="submit">Check in</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="meta" id="meta"></div>
  </form>

  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const meta = document.getElementById('meta');
    const btn = document.getElementById('submit');

    function show(text, ok) {
      msg.textContent = text;
      msg.className = 'msg ' + (ok ? 'ok' : 'err');
    }

    fetch('/api/checkin/me').then(r => r.json()).then(d => {
      if (d.checkin) {
        form.seat.value = d.checkin.seat;
        form.username.value = d.checkin.username;
        show(`You're checked in at ${d.checkin.seat}. Submit again to change it.`, true);
      }
      if (d.ip) meta.textContent = `Your IP: ${d.ip}`;
    }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      try {
        const r = await fetch('/api/checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ seat: form.seat.value, username: form.username.value }),
        });
        const d = await r.json();
        if (d.ok) show(`Thanks ${d.username}, you're checked in at ${d.seat}.`, true);
        else show(d.error || 'Check-in failed.', false);
      } catch (_) {
        show('Could not reach the server. Try again.', false);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
  {% include "_attribution.html" %}
</body>
</html>
