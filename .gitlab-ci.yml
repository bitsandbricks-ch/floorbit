# Lint and test on every merge request and on master, with screenshots for the merge request.
# The Docker image is built every time and pushed to this project's registry from master
# (latest) and from v* tags (the version). A v* tag that matches VERSION also becomes a
# GitLab release with its CHANGELOG.md section:
#
#     mason bump lal-floorplan minor     MR that sets VERSION and adds the changelog section
#     mason release tag lal-floorplan    pushes v<version>; the release job below does the rest

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open MR already gets the MR pipeline: don't run twice.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - lint
  - test
  - build
  - release

variables:
  PYTHON_IMAGE: python:3.11-slim          # the Dockerfile's Python
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  interruptible: true

.pip-cache:
  cache:
    key:
      files: [requirements.txt, requirements-dev.txt]
    paths: [.cache/pip]

# ── lint ──────────────────────────────────────────────────────────────────────

ruff:
  stage: lint
  image: $PYTHON_IMAGE
  extends: .pip-cache
  needs: []
  script:
    - pip install --quiet -r requirements-dev.txt
    # The report shows findings inline in the merge request; the second run fails the job.
    - ruff check --exit-zero --output-format=gitlab . > gl-code-quality-report.json
    - ruff check .
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json

javascript:
  stage: lint
  image: node:22-alpine
  needs: []
  script:
    - for f in $(find static -name '*.js'); do echo "$f"; node --check "$f"; done

# ── test ──────────────────────────────────────────────────────────────────────

pytest:
  stage: test
  image: $PYTHON_IMAGE
  extends: .pip-cache
  needs: []
  script:
    - pip install --quiet -r requirements.txt -r requirements-dev.txt
    - pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

screenshots:
  # Every merge request has screenshots: this takes them, desktop and phone, of every page.
  # Open "Screenshots" in the merge request's pipeline widget and drag them into the description.
  stage: test
  image: mcr.microsoft.com/playwright/python:v1.49.0-noble
  extends: .pip-cache
  needs: []
  services:
    - name: redis:7-alpine
      alias: redis
  variables:
    REDIS_HOST: redis
    APP_URL: http://127.0.0.1:5000
  script:
    - pip install --quiet -r requirements.txt playwright==1.49.0
    - python -m flask --app app run --port 5000 > flask.log 2>&1 &
    - python scripts/screenshots.py screenshots
  after_script:
    - cat flask.log || true
  artifacts:
    expose_as: Screenshots
    paths: [screenshots/]
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# ── build ─────────────────────────────────────────────────────────────────────

docker-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  needs: [ruff, javascript, pytest]
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - |
      tags=""
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then tags="latest"; fi
      if [ -n "${CI_COMMIT_TAG:-}" ]; then tags="${CI_COMMIT_TAG#v}"; fi
      if [ -z "$tags" ]; then echo "Built; images are pushed from $CI_DEFAULT_BRANCH and v* tags only."; exit 0; fi
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      for tag in $tags; do
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$tag"
        docker push "$CI_REGISTRY_IMAGE:$tag"
      done

# ── release ───────────────────────────────────────────────────────────────────

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.20.0
  needs: [docker-image]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  script:
    - sh .gitlab/scripts/release-notes.sh "$CI_COMMIT_TAG" notes.md
    - cat notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: notes.md
